<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Artists | KiKi</title><link rel="icon" href="images/Logo.ico"><style>
@import url('https://fonts.googleapis.com/css2?family=Jersey+20&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:"DM Sans",sans-serif}.page{max-width:1050px;margin:0 auto;padding:52px 28px 80px}.eyebrow{font:18px "Jersey 20",sans-serif;letter-spacing:.12em;color:#888}.page h1{font:clamp(42px,8vw,76px) "Jersey 20",sans-serif;line-height:1;margin:10px 0 12px}.intro{color:#777;line-height:1.8;max-width:650px;font-size:14px}.section-title{font:30px "Jersey 20",sans-serif;margin:42px 0 16px}.muted{color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{border:1px solid #ececec;border-radius:18px;padding:20px;background:#fff;box-shadow:0 8px 28px #00000008}.card h3{font-size:17px;margin:0 0 8px}.card p{font-size:13px;line-height:1.7;color:#777}.pill{display:inline-block;border-radius:100px;background:#f3f3f3;padding:6px 10px;font-size:11px;color:#555}.notice{border:1px solid #eee;border-radius:16px;padding:17px;margin:12px 0}.notice h3{margin:0 0 7px;font-size:16px}.notice p{white-space:pre-wrap;color:#666;line-height:1.7;font-size:14px}.notice img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:10px 0}.news-card{overflow:hidden;border:1px solid #eee;border-radius:18px;background:#fff}.news-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.news-card-body{padding:18px}.news-card h2{font:26px "Jersey 20",sans-serif;margin:0 0 8px}.news-card p{font-size:13px;line-height:1.7;color:#777}.artist-card{display:flex;align-items:center;gap:13px;border:1px solid #eee;border-radius:15px;padding:12px}.artist-card img,.artist-fallback{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#f2f2f2;display:grid;place-items:center;font-weight:700}.artist-card strong{display:block}.artist-card small{color:#999}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border:0;background:#f3f3f3;padding:10px 15px;border-radius:100px;cursor:pointer;font:14px "DM Sans",sans-serif}.tabs button.active{background:#171717;color:white}.post-content{line-height:1.8;color:#555;white-space:pre-wrap}.post-section{margin:22px 0}.post-section h2{font:27px "Jersey 20",sans-serif}.post-section img{width:100%;max-height:440px;object-fit:cover;border-radius:14px;margin:10px 0}.loading,.empty,.error{padding:24px;text-align:center;color:#888;border:1px dashed #ddd;border-radius:14px;font-size:13px}@media(max-width:600px){.page{padding:34px 17px 60px}.card{padding:16px}}
</style></head><body><main class="page"><span class="eyebrow">KIKIFICIAL / ARTIST DIRECTORY</span><h1>Artists</h1><p class="intro">Explore artists across the Hrmnx Entertainment network and the InDesign creative community.</p><div class="tabs"><button class="active" data-artist-tab="hrmnx">Hrmnx Artists</button><button data-artist-tab="indesign">InDesign Artists</button></div><section id="hrmnxArtists"><div class="loading">Loading Hrmnx Artists...</div></section><section id="indesignArtists" hidden><div class="loading">Loading InDesign Artists...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
<script>
const artistTabs=document.querySelectorAll("[data-artist-tab]");
artistTabs.forEach(button=>button.addEventListener("click",()=>{
 artistTabs.forEach(item=>item.classList.toggle("active",item===button));
 document.getElementById("hrmnxArtists").hidden=button.dataset.artistTab!=="hrmnx";
 document.getElementById("indesignArtists").hidden=button.dataset.artistTab!=="indesign";
}));
(async()=>{
 const target=document.getElementById("hrmnxArtists");
 try{
  const {data,error}=await supabaseClient.from("artists").select("id,name,slug,description,avatar_url,bio").order("name");
  if(error)throw error;
  if(!data?.length){target.innerHTML='<div class="empty">No Hrmnx Artists have been added yet.</div>';return;}
  target.innerHTML='<div class="grid">'+data.map(a=>'<article class="artist-card">'+(a.avatar_url?'<img src="'+esc(a.avatar_url)+'" alt="">':'<span class="artist-fallback">'+esc((a.name||"?").slice(0,1))+'</span>')+'<div><strong>'+esc(a.name)+'</strong><small>@'+esc(a.slug||"")+'</small></div></article>').join("")+'</div>';
 }catch(e){target.innerHTML='<div class="error">Could not load Hrmnx Artists: '+esc(e.message)+'</div>';}
 const indesign=document.getElementById("indesignArtists");
 try{
  const {data,error}=await supabaseClient.from("indesign_artists").select("*").order("name");
  if(error)throw error;
  if(!data?.length){indesign.innerHTML='<div class="empty">The InDesign artist directory is not connected yet.</div>';return;}
  indesign.innerHTML='<div class="grid">'+data.map(a=>'<article class="artist-card">'+(a.avatar_url?'<img src="'+esc(a.avatar_url)+'" alt="">':'<span class="artist-fallback">'+esc((a.name||"?").slice(0,1))+'</span>')+'<div><strong>'+esc(a.name)+'</strong><small>'+esc(a.slug||"")+'</small></div></article>').join("")+'</div>';
 }catch(e){indesign.innerHTML='<div class="empty">InDesign Artists will appear here once the InDesign artist directory is connected.</div>';}
})();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
