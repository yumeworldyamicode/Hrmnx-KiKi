<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="images/engfavicon.ico">
  <link rel="stylesheet" href="css/styleyumeworld.css">
  <style>
    @import url('https://fonts.cdnfonts.com/css/nintendo-ds-bios');
    body {
      font-family: "DotGothic16", sans-serif;
      font-size: 1em;
	    background-image: url('images/bg2.png');
	    background-repeat: no-repeat;
      background-size: cover;
	    background-attachment: fixed;
      image-rendering: pixelated;
         }
  </style>
  <script src="https://unpkg.com/cursor-effects@latest/dist/browser.js"></script>
  <link href="https://fonts.cdnfonts.com/css/nintendo-ds-bios" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap" rel="stylesheet">
  <title>Log In or Sign Up - KiKi</title>

</head><body>
<div class="auth-container">
    <img src="images/logo_en.png" alt="" style="width: 75%; display: block; margin: auto; filter: drop-shadow(0 0 3px #ffffff) drop-shadow(0 0 5px #ffffff);">
    <p style="color: white; font-size: 10px; text-align: center;">Redirected from KiKi to Yami's Yumeworld</p>
    <h2>Log In or Sign Up</h2>
    <div class="divider"><span>Powered by HOSHIZORA</span></div>
    <form id="signup-form" class="auth-form">
        <input type="email" id="email" class="form-input" placeholder="Email" required>
        <input type="password" id="password" class="form-input" placeholder="Password" autocomplete="new-password" required>
        <button type="submit" class="btn btn-submit">Continue</button>
    </form>

    <div class="divider"><span>or</span></div>

<button type="button" id="google-btn" class="btn btn-google">
    <svg class="google-icon" xmlns="http://w3.org" viewBox="0 0 48 48" width="18px" height="18px">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24c0-1.61-.15-3.16-.42-4.69H24v8.89h12.66c-.55 2.92-2.19 5.39-4.67 7.05l7.26 5.63C43.5 35.83 46.5 30.33 46.5 24z"/>
        <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.26-5.63c-2.03 1.37-4.63 2.19-8.63 2.19-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Log In or Sign Up with Google
</button>

    <p id="message" class="status-message"></p>
<br>
<p style="color: white; text-align: center; font-size: 12px; margin: 0;">©2026 Hrmnx Entertainment, HOSHIZORA</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
