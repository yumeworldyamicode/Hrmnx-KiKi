<main class="main-container">

    <div class="iframe-wrapper" id="pageContainer">

        <iframe
            id="pageFrame"
            src="home.html"
            title="Website Content">
        </iframe>

    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const frame = document.getElementById("pageFrame");

    if (!frame) {
        console.error("KiKi iframe not found.");
        return;
    }

    function loadKiKiPage(page) {

        frame.classList.add("iframe-fade-out");

        setTimeout(() => {

            frame.src = page + "?v=" + Date.now();

            frame.onload = () => {

                requestAnimationFrame(() => {
                    frame.classList.remove("iframe-fade-out");
                });

            };

        }, 250);
    }


    document.querySelectorAll(
        "[data-kiki-page]"
    ).forEach(link => {

        link.addEventListener("click", event => {

            event.preventDefault();

            const page =
                link.dataset.kikiPage;

            if (!page) {
                return;
            }

            loadKiKiPage(page);

        });

    });


    window.loadKiKiPage = loadKiKiPage;

});
</script>
<script>

window.addEventListener(
    "message",
    event => {

        if (
            !event.data ||
            event.data.type !== "kiki-load-page"
        ) {
            return;
        }


        const pageFrame =
            document.getElementById(
                "pageFrame"
            );


        if (!pageFrame) {
            return;
        }


        pageFrame.src =
            event.data.url;

    }
);

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
