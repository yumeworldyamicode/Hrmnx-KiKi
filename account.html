<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account - KiKi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main id="account-page">

        <section class="account-profile">

            <img
                id="account-avatar"
                src=""
                alt="Profile picture"
            >

            <h1 id="account-display-name">
                Loading...
            </h1>

            <p id="account-username"></p>

            <p id="account-bio"></p>

            <div
                id="staff-badge"
                style="display: none;"
            >
                <img
                    src="images/Kikifficial.gif"
                    alt="KiKifficial"
                >

                <span>Staff member</span>
            </div>

<button id="edit-profile-button">
    Edit profile
</button>

<div id="edit-profile-panel" style="display: none;">

    <form id="edit-profile-form">

        <label for="edit-display-name">
            Display name
        </label>

        <input
            type="text"
            id="edit-display-name"
            maxlength="50"
            required
        >

        <label for="edit-username">
            Username
        </label>

        <input
            type="text"
            id="edit-username"
            maxlength="30"
            placeholder="yourusername"
        >

        <label for="edit-bio">
            Bio
        </label>

        <textarea
            id="edit-bio"
            maxlength="160"
            rows="4"
        ></textarea>

        <button type="submit">
            Save changes
        </button>

        <button
            type="button"
            id="cancel-edit-profile"
        >
            Cancel
        </button>

        <p id="profile-edit-message"></p>

    </form>

</div>

        </section>


        <section class="account-actions">

            <a href="your-posts.html">
                Your posts
            </a>

            <a href="liked-posts.html">
                Liked posts
            </a>

            <a href="favorites.html">
                Favorites
            </a>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/account.js"></script>

</body>

</html>
