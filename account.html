<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACCOUNT</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');

    /* =========================================================
       BASE
    ========================================================= */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background: #ffffff;
        color: #151515;
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
    }


    /* =========================================================
       KIKI ACCOUNT HEADER
    ========================================================= */

    .kiki-header {
        width: 100%;

        padding: 28px 45px 20px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        border-bottom: 1px solid #eeeeee;
    }

    .kiki-brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .kiki-logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .kiki-subtitle {
        color: #888888;
        font-size: 13px;
    }


    /* =========================================================
       ACCOUNT PAGE
    ========================================================= */

    #account-page {
        width: 100%;
        max-width: 950px;

        margin: 0 auto;

        padding: 35px 25px 70px;
    }


    /* =========================================================
       PROFILE CARD
    ========================================================= */

    .account-profile {
        background: #ffffff;

        border: 1px solid #e9e9e9;

        border-radius: 20px;

        padding: 35px;

        margin-bottom: 22px;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.035);

        text-align: center;
    }


    /* =========================================================
       PROFILE PICTURE
    ========================================================= */

    #account-avatar {
        width: 100px;
        height: 100px;

        display: block;

        margin: 0 auto 20px;

        border-radius: 50%;

        object-fit: cover;

        background: #eeeeee;

        border: 1px solid #e5e5e5;
    }


    /* =========================================================
       PROFILE INFORMATION
    ========================================================= */

    #account-display-name {
        font-size: 30px;

        line-height: 1.25;

        letter-spacing: -0.8px;

        margin-bottom: 5px;
    }

    #account-username {
        color: #999999;

        font-size: 13px;

        margin-bottom: 12px;
    }

    #account-bio {
        max-width: 600px;

        margin: 0 auto;

        color: #555555;

        font-size: 14px;

        line-height: 1.7;
    }


    /* =========================================================
       STAFF BADGE
    ========================================================= */

    #staff-badge {
        width: fit-content;

        display: flex;

        align-items: center;

        gap: 7px;

        margin: 18px auto 0;

        padding: 6px 11px;

        background: #f5f5f5;

        border-radius: 100px;

        color: #555555;

        font-size: 11px;

        font-weight: 600;
    }

    #staff-badge img {
        width: 20px;
        height: 20px;

        object-fit: contain;

        border-radius: 50%;
    }


    /* =========================================================
       EDIT PROFILE BUTTON
    ========================================================= */

    #edit-profile-button {
        border: none;

        background: #151515;

        color: white;

        padding: 10px 18px;

        margin-top: 22px;

        border-radius: 100px;

        cursor: pointer;

        font-family: inherit;

        font-size: 13px;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    #edit-profile-button:hover {
        background: #303030;

        transform: translateY(-1px);
    }


    /* =========================================================
       EDIT PROFILE PANEL
    ========================================================= */

    #edit-profile-panel {
        max-width: 600px;

        margin: 25px auto 0;

        padding-top: 25px;

        border-top: 1px solid #eeeeee;

        text-align: left;
    }

    #edit-profile-form {
        display: flex;

        flex-direction: column;

        gap: 9px;
    }

    #edit-profile-form label {
        color: #777777;

        font-size: 12px;

        font-weight: 500;

        margin-top: 5px;
    }

    #edit-profile-form input,
    #edit-profile-form textarea {
        width: 100%;

        padding: 11px 13px;

        border: 1px solid #dddddd;

        border-radius: 9px;

        background: #fafafa;

        color: #151515;

        font-family: inherit;

        font-size: 13px;

        outline: none;

        transition:
            border-color 0.2s ease,
            background 0.2s ease;
    }

    #edit-profile-form input:focus,
    #edit-profile-form textarea:focus {
        border-color: #151515;

        background: #ffffff;
    }

    #edit-profile-form textarea {
        min-height: 100px;

        resize: vertical;
    }


    /* =========================================================
       SAVE / CANCEL BUTTONS
    ========================================================= */

    #edit-profile-form button {
        width: fit-content;

        border: none;

        border-radius: 100px;

        padding: 10px 18px;

        font-family: inherit;

        font-size: 13px;

        cursor: pointer;

        transition:
            background 0.2s ease,
            color 0.2s ease,
            transform 0.2s ease;
    }

    #edit-profile-form button[type="submit"] {
        margin-top: 8px;

        background: #151515;

        color: white;
    }

    #edit-profile-form button[type="submit"]:hover {
        background: #303030;

        transform: translateY(-1px);
    }

    #cancel-edit-profile {
        background: #f5f5f5;

        color: #555555;
    }

    #cancel-edit-profile:hover {
        background: #ededed;

        transform: translateY(-1px);
    }

    #profile-edit-message {
        color: #777777;

        font-size: 12px;

        line-height: 1.5;

        margin-top: 5px;
    }


    /* =========================================================
       ACCOUNT ACTIONS
    ========================================================= */

    .account-actions {
        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 12px;
    }

    .account-actions a {
        display: flex;

        align-items: center;
        justify-content: center;

        min-height: 65px;

        padding: 15px;

        background: #ffffff;

        border: 1px solid #e9e9e9;

        border-radius: 16px;

        color: #151515;

        text-decoration: none;

        font-size: 13px;

        font-weight: 500;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.025);

        transition:
            background 0.2s ease,
            transform 0.2s ease,
            border-color 0.2s ease;
    }

    .account-actions a:hover {
        background: #f7f7f7;

        border-color: #dddddd;

        transform: translateY(-2px);
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 700px) {

        .kiki-header {
            padding: 22px 20px 16px;
        }

        .kiki-logo {
            font-size: 25px;
        }

        .kiki-subtitle {
            display: none;
        }

        #account-page {
            padding: 25px 15px 50px;
        }

        .account-profile {
            padding: 25px 20px;
        }

        #account-display-name {
            font-size: 25px;
        }

        #account-avatar {
            width: 85px;
            height: 85px;
        }

        .account-actions {
            grid-template-columns: 1fr;
        }

        .account-actions a {
            min-height: 55px;
        }
    }
</style>
</head>


<body>


    <!-- =========================================================
         KIKI INTERNAL HEADER
    ========================================================== -->

    <header class="kiki-header">

        <div class="kiki-brand">

            <div class="kiki-logo">
                Account
            </div>

            <div class="kiki-subtitle">
                Your Own Special Place
            </div>

        </div>

    </header>

    <main id="account-page">

        <section class="account-profile">

            <img
                id="account-avatar"
                src=""
                alt="Profile picture"
            >

            <h1 id="account-display-name">
                Loading...
            </h1>

            <p id="account-username"></p>

            <p id="account-bio"></p>

            <div
                id="staff-badge"
                style="display: none;"
            >
                <img
                    src="images/Kikifficial.gif"
                    alt="KiKifficial"
                >

                <span>Staff member</span>
            </div>

<button id="edit-profile-button">
    Edit profile
</button>

<div id="edit-profile-panel" style="display: none;">

    <form id="edit-profile-form">

        <label for="edit-display-name">
            Display name
        </label>

        <input
            type="text"
            id="edit-display-name"
            maxlength="50"
            required
        >

        <label for="edit-username">
            Username
        </label>

        <input
            type="text"
            id="edit-username"
            maxlength="30"
            placeholder="yourusername"
        >

        <label for="edit-bio">
            Bio
        </label>

        <textarea
            id="edit-bio"
            maxlength="160"
            rows="4"
        ></textarea>

        <button type="submit">
            Save changes
        </button>

        <button
            type="button"
            id="cancel-edit-profile"
        >
            Cancel
        </button>

        <p id="profile-edit-message"></p>

    </form>

</div>

        </section>


        <section class="account-actions">

            <a href="your-posts.html">
                Your posts
            </a>

            <a href="liked-posts.html">
                Liked posts
            </a>

            <a href="favorites.html">
                Favorites
            </a>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/account.js"></script>

</body>

</html>
