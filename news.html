<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>News | KiKi</title><link rel="icon" href="images/Logo.ico"><style>
@import url('https://fonts.googleapis.com/css2?family=Jersey+20&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:"DM Sans",sans-serif}.page{max-width:1050px;margin:0 auto;padding:52px 28px 80px}.eyebrow{font:18px "Jersey 20",sans-serif;letter-spacing:.12em;color:#888}.page h1{font:clamp(42px,8vw,76px) "Jersey 20",sans-serif;line-height:1;margin:10px 0 12px}.intro{color:#777;line-height:1.8;max-width:650px;font-size:14px}.section-title{font:30px "Jersey 20",sans-serif;margin:42px 0 16px}.muted{color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{border:1px solid #ececec;border-radius:18px;padding:20px;background:#fff;box-shadow:0 8px 28px #00000008}.card h3{font-size:17px;margin:0 0 8px}.card p{font-size:13px;line-height:1.7;color:#777}.pill{display:inline-block;border-radius:100px;background:#f3f3f3;padding:6px 10px;font-size:11px;color:#555}.notice{border:1px solid #eee;border-radius:16px;padding:17px;margin:12px 0}.notice h3{margin:0 0 7px;font-size:16px}.notice p{white-space:pre-wrap;color:#666;line-height:1.7;font-size:14px}.notice img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:10px 0}.news-card{overflow:hidden;border:1px solid #eee;border-radius:18px;background:#fff}.news-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.news-card-body{padding:18px}.news-card h2{font:26px "Jersey 20",sans-serif;margin:0 0 8px}.news-card p{font-size:13px;line-height:1.7;color:#777}.artist-card{display:flex;align-items:center;gap:13px;border:1px solid #eee;border-radius:15px;padding:12px}.artist-card img,.artist-fallback{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#f2f2f2;display:grid;place-items:center;font-weight:700}.artist-card strong{display:block}.artist-card small{color:#999}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border:0;background:#f3f3f3;padding:10px 15px;border-radius:100px;cursor:pointer;font:14px "DM Sans",sans-serif}.tabs button.active{background:#171717;color:white}.post-content{line-height:1.8;color:#555;white-space:pre-wrap}.post-section{margin:22px 0}.post-section h2{font:27px "Jersey 20",sans-serif}.post-section img{width:100%;max-height:440px;object-fit:cover;border-radius:14px;margin:10px 0}.loading,.empty,.error{padding:24px;text-align:center;color:#888;border:1px dashed #ddd;border-radius:14px;font-size:13px}@media(max-width:600px){.page{padding:34px 17px 60px}.card{padding:16px}}
</style></head><body data-hrmnx-app="kiki" data-hrmnx-version="1.0.0"><main class="page"><span class="eyebrow">KIKIFICIAL / LATEST UPDATES</span><h1>News</h1><p class="intro">Updates, announcements and stories from across Hrmnx Entertainment.</p><h2 class="section-title">Latest News</h2><div id="newsList"><div class="loading">Loading News Posts...</div></div><h2 class="section-title">Serashio Notices</h2><p class="intro">Official artist notices originally published through Serashio.</p><div id="serashioNotices"><div class="loading">Loading Serashio Notices...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
<script>
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function date(v){return v?new Date(v).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}):"";}
(async()=>{
 const list=document.getElementById("newsList");
 try{
  const {data,error}=await supabaseClient.from("kiki_news_posts").select("id,title,subtitle,header_image_url,sections,created_at").eq("is_published",true).order("created_at",{ascending:false});
  if(error)throw error;
  if(!data?.length){list.innerHTML='<div class="empty">There are no News Posts yet.</div>';return;}
  list.innerHTML='<div class="grid">'+data.map(p=>'<article class="news-card">'+(p.header_image_url?'<img src="'+esc(p.header_image_url)+'" alt="">':'')+'<div class="news-card-body"><span class="pill">'+date(p.created_at)+'</span><h2>'+esc(p.title)+'</h2><p>'+esc(p.subtitle||"")+'</p><button type="button" data-news-id="'+esc(p.id)+'" style="margin-top:12px;border:0;background:#171717;color:white;padding:10px 15px;border-radius:100px;cursor:pointer">Read News Post</button></div></article>').join("")+'</div>';
  list.querySelectorAll("[data-news-id]").forEach(b=>b.addEventListener("click",()=>openNewsPost(data.find(p=>String(p.id)===b.dataset.newsId))));
 }catch(e){list.innerHTML='<div class="error">News Posts are not available yet. '+esc(e.message)+'</div>';}
 const notices=document.getElementById("serashioNotices");
 try{
  const {data,error}=await supabaseClient.from("notices").select("id,title,content,image_url,created_at,artists(name,slug)").order("created_at",{ascending:false}).limit(12);
  if(error)throw error;
  if(!data?.length){notices.innerHTML='<div class="empty">There are no Serashio Notices at the moment.</div>';return;}
  notices.innerHTML=data.map(n=>'<article class="notice"><span class="pill">'+esc(n.artists?.name||"Serashio")+' · '+date(n.created_at)+'</span><h3>'+esc(n.title)+'</h3>'+(n.image_url?'<img src="'+esc(n.image_url)+'" alt="">':'')+'<p>'+esc(n.content)+'</p></article>').join("");
 }catch(e){notices.innerHTML='<div class="empty">Serashio Notices could not be loaded.</div>';}
})();
function openNewsPost(post){
 const sections=Array.isArray(post.sections)?post.sections:[];
 const body='<span class="eyebrow">KIKIFICIAL / NEWS POST</span><button id="backNews" style="float:right;border:0;background:#f1f1f1;border-radius:100px;padding:9px 13px;cursor:pointer">← Back to News</button><h1>'+esc(post.title)+'</h1><p class="intro">'+esc(post.subtitle||"")+'</p>'+(post.header_image_url?'<img src="'+esc(post.header_image_url)+'" style="width:100%;max-height:460px;object-fit:cover;border-radius:18px;margin:25px 0" alt="">':'')+sections.map(s=>'<section class="post-section">'+(s.heading?'<h2>'+esc(s.heading)+'</h2>':'')+(s.image_url?'<img src="'+esc(s.image_url)+'" alt="">':'')+'<div class="post-content">'+esc(s.content||"")+'</div></section>').join("");
 document.querySelector(".page").innerHTML=body;
 document.getElementById("backNews").addEventListener("click",()=>location.reload());
}
</script><script src="https://nemawashi.hrmnx.site/js/hrmnx-app-shell.js?v=20261118-1"></script>
</body></html>
